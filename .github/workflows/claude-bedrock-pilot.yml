name: Claude Bedrock - Authorized Pilot
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency:
  group: nexvary-claude-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'nexvary/NEXVARY-MR' && github.actor == 'nexvary' && github.ref == 'refs/heads/integration/claude-bedrock-cloud-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect non-secret GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(json.dumps({k: claims.get(k) for k in ("iss", "sub", "aud", "repository", "repository_id", "repository_owner_id", "ref", "event_name")}, indent=2))
          PY
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.NEXVARY_BEDROCK_ROLE_ARN }}
          aws-region: eu-central-1
          role-duration-seconds: 900
          retry-max-attempts: 2
      - name: Verify AWS role
        shell: bash
        run: |
          aws sts get-caller-identity --query Arn --output text | grep -F ':assumed-role/nexvary-github-bedrock-development/'
      - name: Claude writes bounded pilot document
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
          AWS_REGION: eu-central-1
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-cli" @anthropic-ai/claude-code@2.1.328 --no-audit --no-fund
          "$RUNNER_TEMP/claude-cli/node_modules/.bin/claude" -p 'Write a short Markdown document for docs/CLAUDE_CLOUD_PILOT.md stating that this is an isolated cloud development pilot and does not prove production release readiness. Return ONLY the Markdown document text. Do not use tools, edit files, or run commands.' --model eu.anthropic.claude-sonnet-4-6 --max-turns 5 --tools '' --no-session-persistence --output-format json > "$RUNNER_TEMP/pilot-result.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ["RUNNER_TEMP"],"pilot-result.json")
          data=json.load(open(p))
          assert data.get("type")=="result" and not data.get("is_error"), "Claude execution failed"
          from pathlib import Path
          content = data.get("result", "")
          assert isinstance(content, str) and len(content.strip()) >= 40, "Claude did not return usable document text"
          assert "pilot" in content.lower(), "Claude response does not describe the pilot"
          target = Path("docs/CLAUDE_CLOUD_PILOT.md")
          target.parent.mkdir(parents=True, exist_ok=True)
          assert not target.exists(), "Pilot document already exists; refusing overwrite"
          target.write_text(content.rstrip() + "\\n", encoding="utf-8")
          print("Claude completed; reported turns:",data.get("num_turns"))
          print("Wrote Claude-authored document bytes:",target.stat().st_size)
          PY
      - name: Validate exact file scope
        shell: bash
        run: |
          echo 'Changed files:'
          git status --short --untracked-files=all
          echo 'Document details:'
          ls -l docs/CLAUDE_CLOUD_PILOT.md || true
          test -s docs/CLAUDE_CLOUD_PILOT.md
          test "$(git status --porcelain --untracked-files=all | wc -l)" -eq 1
          test "$(git status --porcelain --untracked-files=all | sed 's/^...//')" = 'docs/CLAUDE_CLOUD_PILOT.md'
      - name: Publish isolated draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="claude/pilot-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add -- docs/CLAUDE_CLOUD_PILOT.md
          git commit -m 'docs: Claude Bedrock cloud pilot'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base integration/claude-bedrock-cloud-20261119 --head "$branch" --title 'docs: Claude Bedrock cloud pilot' --body 'Isolated Claude Code Bedrock pilot. Documentation only; no application code changed.'
