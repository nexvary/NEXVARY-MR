name: Android metadata agent
on:
  push:
    branches: [main, dev/cpp-qt-foundation]
    paths: ['recovery-agent/**', '.github/workflows/android-agent.yml']
  pull_request:
    paths: ['recovery-agent/**', '.github/workflows/android-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mr-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovery-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify pinned Gradle wrapper
        run: |
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          chmod +x gradlew
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, lint and unit tests
        run: ./gradlew --no-daemon --console=plain assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug :npse-core:check :npse-android:assembleRelease :npse-core:jar
      - name: Verify APK permission boundary
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/permissions.txt
          if rg 'android.permission.(INTERNET|MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES)' app/build/outputs/apk/debug/permissions.txt; then exit 1; fi
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nexvary-mr-android-agent-debug
          path: recovery-agent/app/build/outputs/apk/debug/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexvary-mr-android-unit-lint-evidence
          path: |
            recovery-agent/app/build/reports/
            recovery-agent/app/build/test-results/
            recovery-agent/npse-android/build/reports/
            recovery-agent/npse-android/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: nexvary-npse-libraries-alpha
          path: |
            recovery-agent/npse-android/build/outputs/aar/*release.aar
            recovery-agent/npse-core/build/libs/*.jar
          if-no-files-found: error
  emulator:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: recovery-agent
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon --console=plain connectedDebugAndroidTest
            adb pull /data/local/tmp/nexvary-agent-emulator-ui.png app/build/emulator-native-ui.png
            adb pull /data/local/tmp/nexvary-npse-ui.png app/build/npse-native-ui.png
            test "$(file --brief --mime-type app/build/emulator-native-ui.png)" = image/png
            adb shell rm /data/local/tmp/nexvary-agent-emulator-ui.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexvary-mr-android-emulator-tests-api-${{ matrix.api }}
          path: |
            recovery-agent/app/build/reports/androidTests/
            recovery-agent/app/build/outputs/androidTest-results/
            recovery-agent/app/build/emulator-native-ui.png
            recovery-agent/app/build/npse-native-ui.png
