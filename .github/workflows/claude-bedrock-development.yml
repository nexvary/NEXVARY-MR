name: Claude Bedrock development
on:
  push:
    branches: ['integration/claude-bedrock-cloud-20261119']
    paths: ['.github/workflows/claude-bedrock-development.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Authentication only, minimal smoke test, or authorized development
        type: choice
        default: auth
        options: [auth, smoke, develop]
      task:
        description: Authorized bounded development task
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: nexvary-claude-development
  cancel-in-progress: false
jobs:
  develop:
    if: github.repository == 'nexvary/NEXVARY-MR' && github.actor == 'nexvary' && github.ref == 'refs/heads/integration/claude-bedrock-cloud-20261119'
    env:
      AWS_REGION: eu-central-1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check deployment configuration
        env:
          ROLE: ${{ vars.NEXVARY_BEDROCK_ROLE_ARN }}
        run: |
          test -n "$ROLE" || { echo "::error::Dedicated OIDC IAM role is not configured"; exit 1; }
      - name: Inspect non-secret OIDC claims
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(json.dumps({k: claims.get(k) for k in ["iss", "sub", "aud", "repository", "ref", "event_name"]}))
          PY
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.NEXVARY_BEDROCK_ROLE_ARN }}
          aws-region: eu-central-1
          role-duration-seconds: 900
          retry-max-attempts: 2
      - name: Verify temporary AWS identity
        run: |
          aws sts get-caller-identity --output json > "$RUNNER_TEMP/aws-identity.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/aws-identity.json") as f:
              identity = json.load(f)
          assert identity["Account"] == "716997672148", "Unexpected AWS account"
          assert ":assumed-role/nexvary-github-bedrock-development/" in identity["Arn"], "Unexpected IAM role"
          print("Verified AWS account:", identity["Account"])
          print("Verified assumed role:", identity["Arn"])
          PY
      - name: Minimal Sonnet 4.6 smoke test
        id: smoke
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke' || github.event_name == 'push' && contains(github.event.head_commit.message, '[bedrock-smoke]')) && github.run_attempt == 1
        env:
          CLAUDE_CODE_USE_BEDROCK: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-cli" @anthropic-ai/claude-code@2.1.328 --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/bedrock-smoke"
          cd "$RUNNER_TEMP/bedrock-smoke"
          "$RUNNER_TEMP/claude-cli/node_modules/.bin/claude" --version
          "$RUNNER_TEMP/claude-cli/node_modules/.bin/claude" -p 'Reply exactly NEXVARY_BEDROCK_OK.' --model eu.anthropic.claude-sonnet-4-6 --max-turns 1 --tools "" --safe-mode --restricted --no-session-persistence --system-prompt 'Return only the requested verification text.' --output-format json > "$RUNNER_TEMP/claude-smoke.json"
          echo "execution_file=$RUNNER_TEMP/claude-smoke.json" >> "$GITHUB_OUTPUT"
      - name: Verify smoke response and record estimated usage
        if: steps.smoke.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.smoke.outputs.execution_file }}
        run: |
          python3 - <<'PY'
          import os, json
          with open(os.environ["EXECUTION_FILE"]) as f:
              raw = f.read()
          try:
              data = json.loads(raw)
              events = data if isinstance(data, list) else [data]
          except json.JSONDecodeError:
              events = [json.loads(line) for line in raw.splitlines() if line.strip()]
          results = [event for event in events if event.get("type") == "result"]
          assert results, "No Claude result event"
          result = results[-1]
          assert not result.get("is_error"), "Claude returned an error"
          assert "NEXVARY_BEDROCK_OK" in result.get("result", ""), "Expected smoke response missing"
          print(json.dumps({key: result.get(key) for key in ["result", "usage", "total_cost_usd", "num_turns", "modelUsage"]}))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("Verified Claude response: NEXVARY_BEDROCK_OK\\n\\n")
              f.write("SDK estimated cost USD: " + str(result.get("total_cost_usd", "not reported")) + "\\n")
          PY
      - name: Authorized development
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'develop' && inputs.task != ''
        uses: anthropics/claude-code-action@5f6f4f420751e8ae8a3261e5d4c7cd49134c04f6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: 'true'
          prompt: |
            Work only on a new feature branch from the checked-out integration baseline.
            Never merge, push main, change workflows/IAM, reveal secrets, or invoke paid external services.
            Read AGENTS.md. Preserve existing work. Report tests and blockers honestly.
            Owner task:
            ${{ inputs.task }}
          claude_args: '--model eu.anthropic.claude-sonnet-4-6 --max-turns 12'
