name: C++20 and Qt Windows
on:
  push:
    paths:
      - 'cpp/**'
      - 'qml/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp-qt.yml'
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ core
        run: cmake -S . -B build -DBUILD_TESTING=ON -DMR_BUILD_GUI=OFF
      - name: Build core and tests
        run: cmake --build build --config Release
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
  qt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure GUI
        run: cmake -S . -B build -DBUILD_TESTING=ON -DMR_BUILD_GUI=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build GUI
        run: cmake --build build --config Release
      - name: Test core
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Assemble portable Qt runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build/Release/nexvary_mr.exe'
          if (-not (Test-Path $exe)) { $exe = 'build/nexvary_mr.exe' }
          if (-not (Test-Path $exe)) { throw 'Qt executable not found' }
          New-Item -ItemType Directory -Force -Path dist/NEXVARY-MR | Out-Null
          Copy-Item $exe dist/NEXVARY-MR/NEXVARY-MR.exe
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --qmldir qml --no-translations dist/NEXVARY-MR/NEXVARY-MR.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-MR-Windows-portable-unsigned
          path: dist/NEXVARY-MR/
          if-no-files-found: error
