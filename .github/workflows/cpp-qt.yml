name: C++20 and Qt Windows
on:
  push:
    branches: [fix/mr-auth-permissions-lampyre-ux, main, dev/cpp-qt-foundation, feature/government-operations, integration/forensic-engines-audit]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mr-cpp-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core:
    # Focused icon/installer release; retain the full matrix on other branches.
    if: ${{ !(github.head_ref == 'fix/intelligence-p0-completion' || github.ref == 'refs/heads/fix/intelligence-p0-completion') }}
    strategy:
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ core
        run: cmake -S . -B build -DBUILD_TESTING=ON -DMR_BUILD_GUI=OFF -DMR_WARNINGS_AS_ERRORS=ON
      - name: Build core and tests
        run: cmake --build build --config Release --parallel
      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure --output-junit core-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results-${{ matrix.os }}
          path: build/core-results.xml
  linux-forensic-integration:
    # Focused icon/installer release; retain the full matrix on other branches.
    if: ${{ !(github.head_ref == 'fix/intelligence-p0-completion' || github.ref == 'refs/heads/fix/intelligence-p0-completion') }}
    strategy:
      fail-fast: false
      matrix:
        profile: [production, laboratory]
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      MR_TSK_MMLS_PATH: /usr/bin/mmls
      MR_CLAMSCAN_PATH: /usr/bin/clamscan
      MR_REQUIRE_BARCODE_DECODER: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and separately packaged TSK for synthetic integration
        timeout-minutes: 10
        run: |
          # Prefer the signed official archive over the Azure mirror that timed
          # out while transferring packages. Keep normal APT authentication,
          # retries, IO timeouts and the existing bounded step deadline.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf 'https://security.ubuntu.com/ubuntu/\tpriority:1\nhttps://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake ninja-build gdb qt6-base-dev qt6-declarative-dev qt6-image-formats-plugins libqt6svg6 qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtquick-dialogs qml6-module-qttest qml6-module-qtqml-workerscript sleuthkit clamav zbar-tools poppler-utils python3-venv python3-cryptography curl
      - name: Prepare pinned signed-manifest verification dependency
        timeout-minutes: 10
        run: |
          echo "MR_SODIUM_ROOT=$RUNNER_TEMP/nexvary-sodium" >> "$GITHUB_ENV"
          python3 scripts/prepare_sodium.py --destination "$RUNNER_TEMP/nexvary-sodium"
      - name: Retain signature dependency provenance
        if: always()
        run: |
          mkdir -p build
          for name in build-receipt.json build.log; do
            if [ -f "$RUNNER_TEMP/nexvary-sodium/$name" ]; then cp "$RUNNER_TEMP/nexvary-sodium/$name" "build/sodium-$name"; fi
          done
      - name: Configure and build native GUI and fixtures
        run: |
          cmake -S . -B build -G Ninja -DMR_BUILD_GUI=ON -DMR_BUILD_UPDATE_VERIFIER=ON -DBUILD_TESTING=ON -DMR_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-g -DMR_ENABLE_LAB_OPERATIONS=${{ matrix.profile == 'laboratory' && 'ON' || 'OFF' }}
          cmake --build build --parallel 2
      - name: Run Qt, recovery and real mmls synthetic-image integration
        run: |
          python3 scripts/diagnose_ui_failure.py --build build
          ctest --test-dir build -R '^mr_gui_smoke$' --repeat until-fail:3 --output-on-failure --output-junit gui-repeat-results.xml --output-log build/gui-repeat-console.txt
      - name: Measure bounded synthetic case services
        if: matrix.profile == 'production' && env.MR_SKIP_SETUP != 'true'
        run: |
          cmake --build build --target mr_case_workload_benchmark --parallel 2
          QT_QPA_PLATFORM=offscreen build/mr_case_workload_benchmark > build/case-workload-benchmark.json
      - name: Instrument parser, identity and signed-update regressions
        if: matrix.profile == 'production' && env.MR_SKIP_SETUP != 'true'
        run: |
          cmake -S . -B build-avb-sanitized -G Ninja -DMR_BUILD_GUI=ON -DMR_BUILD_UPDATE_VERIFIER=ON -DBUILD_TESTING=ON -DMR_SANITIZERS=ON -DMR_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-avb-sanitized --target mr_owned_process_tests mr_partition_transaction_tests mr_case_transaction_tests mr_policy_audit_tests mr_offline_tests mr_artifact_tests mr_timeline_tests mr_import_tests mr_tool_tests mr_mirror_tests mr_retention_tests mr_identity_tests mr_law_workspace_tests mr_avb_mutation_tests mr_pcap_mutation_tests mr_exif_mutation_tests mr_update_tests mr_update_journal_tests mr_update_key_tests --parallel 2
          UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-avb-sanitized -R '^mr_(((avb|pcap|exif)_mutation|owned_process|partition_transaction|case_transaction|policy_audit|offline|artifact|timeline|import|tool|mirror|retention|identity|law_workspace|update|update_journal|update_key)_tests|adb_backup_interop)$' --output-on-failure --output-junit avb-sanitizer-results.xml
      - name: Native Qt client through real Gunicorn and verified Caddy TLS
        if: matrix.profile == 'production' && env.MR_SKIP_SETUP != 'true'
        run: |
          bash server/tracking-portal/tests/prepare_runtime.sh build/portal-runtime
          build/portal-runtime/venv/bin/python server/tracking-portal/tests/integration.py --caddy build/portal-runtime/caddy --native-tests build/mr_cloud_tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXVARY-MR-Linux-${{ matrix.profile }}-integration-evidence
          path: |
            build/linux-qt-results.xml
            build/gui-repeat-results.xml
            build/gui-repeat-console.txt
            build/full-suite-last-test.log
            build/full-suite-failed-tests.log
            build/*-gdb.txt
            build/ui-crash-diagnostics.json
            build/ui-crash-diagnostic-error.txt
            build/*-results.txt
            build/policy-audit-interop-results.json
            build/adb-backup-interop-results.json
            build/case-workload-benchmark.json
            build/**/smoke*.png
            build/Testing/Temporary/LastTest.log
            build/sodium-build-receipt.json
            build/sodium-build.log
            build-avb-sanitized/avb-sanitizer-results.xml
            build-avb-sanitized/adb-backup-interop-results.json
            build-avb-sanitized/Testing/Temporary/LastTest.log
  tracking-server:
    # Focused icon/installer release; retain the full matrix on other branches.
    if: ${{ !(github.head_ref == 'fix/intelligence-p0-completion' || github.ref == 'refs/heads/fix/intelligence-p0-completion') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test portal, validate and bundle single-file server installer
        run: |
          python3 -m unittest discover -s server/tracking-portal/tests -v
          bash -n server/tracking-portal/install.sh
          python3 server/tracking-portal/build_bundle.py dist/NEXVARY-Portal-Setup.sh
          bash dist/NEXVARY-Portal-Setup.sh --domain tracking.example.com --email admin@example.com --dry-run
          cd dist
          sha256sum NEXVARY-Portal-Setup.sh > NEXVARY-Portal-SHA256SUMS.txt
      - name: Install, upgrade, back up, restore and rotate on disposable systemd VM
        run: sudo --preserve-env=GITHUB_ACTIONS python3 server/tracking-portal/tests/vm_smoke.py dist/NEXVARY-Portal-Setup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Portal-Server-Installer
          path: |
            dist/NEXVARY-Portal-Setup.sh
            dist/NEXVARY-Portal-SHA256SUMS.txt
          if-no-files-found: error
  qt:
    # Owner approved the completed Windows-only Setup release.
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ (github.head_ref == 'fix/intelligence-p0-completion' || github.ref == 'refs/heads/fix/intelligence-p0-completion') && fromJSON('["production"]') || fromJSON('["production","laboratory"]') }}
    runs-on: windows-2022
    env:
      QT_QUICK_BACKEND: software
      MR_UI_ICON_FOCUS: '1'
      MR_SKIP_SETUP: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.head_ref == 'fix/intelligence-p0-completion' && github.event.pull_request.head.sha || github.sha }}
      - name: Reuse verified native tests for the isolated installer repair
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verifiedSource = '06828bc686f79ad2dd7967aa17331cee9ef67077'
          $parent = git rev-parse HEAD^
          if ($LASTEXITCODE -ne 0) { throw 'Cannot establish installer repair parent' }
          if ($parent -eq $verifiedSource -and '${{ github.head_ref }}' -eq 'fix/intelligence-p0-completion') {
            $files = @(git diff --name-only $verifiedSource HEAD)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot compare installer repair files' }
            $allowed = @('.github/workflows/cpp-qt.yml','packaging/NEXVARY-MR.iss','tests/test_institutional_installer.py')
            if (@($files | Where-Object { $_ -notin $allowed }).Count -ne 0) { throw 'Installer-only reuse refused: application sources changed' }
            $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
            $verified = Invoke-RestMethod -Uri 'https://api.github.com/repos/nexvary/NEXVARY-MR/actions/jobs/132378935350' -Headers $headers
            if ($verified.head_sha -ne $verifiedSource) { throw 'Native verification source mismatch' }
            $required = @('Verify MCP transport and Windows credential persistence','Build GUI','Run CTest suite','Verify staged installer runtime in isolated path with spaces')
            foreach ($name in $required) {
              if (@($verified.steps | Where-Object { $_.name -eq $name -and $_.conclusion -eq 'success' }).Count -ne 1) { throw "Prior native gate did not pass: $name" }
            }
            New-Item -ItemType Directory -Force dist/evidence | Out-Null
            [ordered]@{sourceCommit=$verifiedSource;run=43572240042;job=132378935350;verifiedSteps=$required;unchangedApplicationSources=$true} | ConvertTo-Json -Depth 4 | Set-Content dist/evidence/native-regression-reuse.json
            'MR_INSTALLER_REPAIR_ONLY=true' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          # A single QML-only follow-up reuses the proven 0.4.7 backend suite.
          # Any other parent or native change keeps the full normal gate.
          $uiBase = '2d53e6300766d88d881370ffa767c7d91e91b54b'
          if ($parent -eq $uiBase -and '${{ github.head_ref }}' -eq 'fix/intelligence-p0-completion') {
            $files = @(git diff --name-only $uiBase HEAD)
            $allowed = @('.github/workflows/cpp-qt.yml','CMakeLists.txt','cpp/src/main.cpp','packaging/NEXVARY-MR.iss','packaging/app.rc','qml/Brand.js','qml/DeviceInspector.qml','qml/TopBar.qml','qml/AppShell.qml','qml/tests/tst_navigation.qml')
            if ($LASTEXITCODE -ne 0 -or @($files | Where-Object { $_ -notin $allowed }).Count -ne 0) { throw 'UI-only reuse refused: unexpected source changes' }
            $before = (git show "${uiBase}:cpp/src/main.cpp") -join "`n"
            $after = (Get-Content cpp/src/main.cpp) -join "`n"
            if ($before.Replace('0.4.7','0.4.8') -cne $after) { throw 'UI-only reuse refused: native main logic changed' }
            $before = (git show "${uiBase}:CMakeLists.txt") -join "`n"
            $after = (Get-Content CMakeLists.txt) -join "`n"
            $expected = $before.Replace('0.4.7','0.4.8').Replace('COMMAND mr_ui_tests WorkstationNavigation::test_yxaOwnerPresentation','COMMAND mr_ui_tests WorkstationNavigation::test_deviceIdentityCopyAndBrand WorkstationNavigation::test_yxaOwnerPresentation')
            if ($expected -cne $after) { throw 'UI-only reuse refused: unexpected native build change' }
            $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
            $verified = Invoke-RestMethod -Uri 'https://api.github.com/repos/nexvary/NEXVARY-MR/actions/jobs/132408836819' -Headers $headers
            if ($verified.head_sha -ne $uiBase -or $verified.conclusion -ne 'success') { throw 'UI-only native evidence mismatch' }
            foreach ($name in @('Verify MCP transport and Windows credential persistence','Run CTest suite','Verify installer installation and deployed runtime')) {
              if (@($verified.steps | Where-Object { $_.name -eq $name -and $_.conclusion -eq 'success' }).Count -ne 1) { throw "Prior native gate did not pass: $name" }
            }
            New-Item -ItemType Directory -Force dist/evidence | Out-Null
            [ordered]@{sourceCommit=$uiBase;run=43582109138;job=132408836819;unchangedBackendSources=$true;freshChecks='clipboard, branded header, RTL/LTR viewport/scale, staged and installed runtime'} | ConvertTo-Json | Set-Content dist/evidence/ui-native-regression-reuse.json
            'MR_UI_REPAIR_ONLY=true' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Parse Windows deployment scripts before building
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/evidence | Out-Null
          $syntaxFailures = @()
          foreach ($sourceFile in (Get-ChildItem packaging -Filter '*.ps1' -File)) {
            $parseTokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($sourceFile.FullName,[ref]$parseTokens,[ref]$parseErrors)
            foreach ($entry in $parseErrors) {
              $syntaxFailures += [ordered]@{file=$sourceFile.Name;line=$entry.Extent.StartLineNumber;message=$entry.Message}
            }
          }
          ConvertTo-Json -InputObject @($syntaxFailures) -Depth 4 | Set-Content dist/evidence/powershell-syntax.json
          if ($syntaxFailures.Count) { $syntaxFailures | Format-Table | Out-String | Write-Host; throw 'Windows deployment script syntax errors' }
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Validate QML syntax before compiling native targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $formatter = Join-Path $env:QT_ROOT_DIR 'bin/qmlformat.exe'
          if (-not (Test-Path -LiteralPath $formatter)) { throw 'Qt QML syntax validator is missing' }
          foreach ($source in (Get-ChildItem qml -Filter '*.qml' -File -Recurse)) {
            & $formatter $source.FullName > $null
            if ($LASTEXITCODE -ne 0) { throw "QML syntax validation failed: $($source.Name)" }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent policy audit verifier
        run: python -m pip install cryptography==50.0.2
      - name: Prepare pinned signed-manifest verification dependency
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "MR_SODIUM_ROOT=$env:RUNNER_TEMP/nexvary-sodium" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python scripts/prepare_sodium.py --destination "$env:RUNNER_TEMP/nexvary-sodium"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned signature dependency preparation failed' }
      - name: Retain signature dependency provenance
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/evidence | Out-Null
          foreach ($name in @('build-receipt.json','build.log')) {
            $source = Join-Path "$env:RUNNER_TEMP/nexvary-sodium" $name
            if (Test-Path $source) { Copy-Item $source (Join-Path 'dist/evidence' "sodium-$name") }
          }
      - name: Supply installed Windows fonts to offscreen Qt tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fontSource = Join-Path $env:SystemRoot 'Fonts'
          $fontTarget = Join-Path $env:RUNNER_TEMP 'NEXVARY-MR-test-fonts'
          New-Item -ItemType Directory -Force $fontTarget | Out-Null
          foreach ($name in @('segoeui.ttf','segoeuib.ttf','tahoma.ttf','tahomabd.ttf','consola.ttf','consolab.ttf')) {
            $source = Join-Path $fontSource $name
            if (-not (Test-Path $source)) { throw "Required installed test font missing: $name" }
            Copy-Item $source $fontTarget
          }
          # These OS fonts stay on this runner; they are never uploaded/bundled.
          "QT_QPA_FONTDIR=$fontTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure GUI and Qt integration tests
        run: cmake -S . -B build -DBUILD_TESTING=ON -DMR_BUILD_GUI=ON -DMR_BUILD_UPDATE_VERIFIER=ON -DMR_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DMR_ENABLE_LAB_OPERATIONS=${{ matrix.profile == 'laboratory' && 'ON' || 'OFF' }}
      - name: Verify MCP transport and Windows credential persistence
        if: env.MR_INSTALLER_REPAIR_ONLY != 'true' && env.MR_UI_REPAIR_ONLY != 'true'
        shell: pwsh
        run: |
          cmake --build build --config Release --target mr_lampyre_connection_tests mr_policy_audit_tests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release -R '^(mr_lampyre_connection_tests|mr_policy_audit_tests)$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build GUI
        id: native_build
        shell: pwsh
        run: |
          if ($env:MR_UI_REPAIR_ONLY -eq 'true') {
            cmake --build build --config Release --target nexvary_mr mr_ui_tests mr_evidence_import_worker mr_build_profile_fixture --parallel
          } elseif ($env:MR_INSTALLER_REPAIR_ONLY -eq 'true') {
            cmake --build build --config Release --target nexvary_mr mr_evidence_import_worker mr_build_profile_fixture --parallel
          } elseif ($env:MR_SKIP_SETUP -eq 'true') {
            # Owner is reviewing QML: build the existing native UI harness only.
            cmake --build build --config Release --target mr_ui_tests --parallel
          } else {
            cmake --build build --config Release --parallel
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify bounded GUI profile probe and production packaging guard
        if: ${{ env.MR_SKIP_SETUP != 'true' && steps.native_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $binaryName = if ('${{ matrix.profile }}' -eq 'laboratory') { 'nexvary_mr_lab.exe' } else { 'nexvary_mr.exe' }
          ./packaging/test-build-profile.ps1 -FixturePath build/Release/mr_build_profile_fixture.exe -ApplicationPath (Join-Path 'build/Release' $binaryName) -ExpectedProfile '${{ matrix.profile }}'
      - name: Prepare verified standalone ClamAV for synthetic Windows integration
        if: ${{ env.MR_SKIP_SETUP != 'true' && steps.native_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'clamav-1.5.4.win.x64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'nexvary-clamav-fixture-runtime'
          Invoke-WebRequest -Uri 'https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.5.4/clamav-1.5.4.win.x64.zip' -OutFile $archive
          $expected = '0d9e0228b2674137ea1a2853566c98a0278ad52ab2582c3d6dbd75373848c395'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Official ClamAV artifact SHA256 mismatch' }
          Expand-Archive -Path $archive -DestinationPath $destination
          $engine = Get-ChildItem $destination -Filter clamscan.exe -File -Recurse | Select-Object -First 1
          if (-not $engine) { throw 'ClamAV executable missing from verified package' }
          & $engine.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Standalone ClamAV runtime failed to start' }
          "MR_CLAMSCAN_PATH=$($engine.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run CTest suite
        id: tests
        shell: pwsh
        run: |
          if ($env:MR_UI_REPAIR_ONLY -eq 'true') {
            ctest --test-dir build -C Release -R '^mr_ui_(owner_review_1([.]25|[.]5)?|scale_1[.]25|scale_1[.]5)$' --output-on-failure --output-junit qt-results.xml
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ctest --test-dir build -C Release -R '^mr_gui_smoke$' --repeat until-fail:3 --output-on-failure --output-junit gui-repeat-results.xml
            exit $LASTEXITCODE
          }
          if ($env:MR_INSTALLER_REPAIR_ONLY -eq 'true') {
            ctest --test-dir build -C Release -R '^mr_gui_smoke$' --repeat until-fail:3 --output-on-failure --output-junit qt-results.xml
            exit $LASTEXITCODE
          }
          if ($env:MR_SKIP_SETUP -eq 'true') {
            ctest --test-dir build -C Release -R '^mr_ui_(owner_review_1([.]25|[.]5)?|scale_1[.]25|scale_1[.]5)$' --output-on-failure --output-junit qt-results.xml
          } else {
            ctest --test-dir build -C Release --output-on-failure --output-junit qt-results.xml
          }
          $testResult = $LASTEXITCODE
          Get-ChildItem build/*-results.txt | ForEach-Object { Get-Content $_.FullName }
          if ($testResult -ne 0) { exit $testResult }
          Copy-Item build/Testing/Temporary/LastTest.log build/full-suite-last-test.log
          if ($env:MR_SKIP_SETUP -ne 'true') {
            ctest --test-dir build -C Release -R '^mr_gui_smoke$' --repeat until-fail:3 --output-on-failure --output-junit gui-repeat-results.xml --output-log build/gui-repeat-console.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify read-only Windows USB inventory
        if: env.MR_SKIP_SETUP != 'true'
        id: usb_inventory
        shell: pwsh
        run: |
          $raw = & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -File packaging/inspect-usb.ps1
          if ($LASTEXITCODE -ne 0) { throw 'USB inventory collector failed' }
          $inventory = $raw | ConvertFrom-Json
          if ($inventory.schemaVersion -ne 1 -or $null -eq $inventory.devices) { throw 'Invalid USB inventory schema' }
          "USB inventory schema validated; device count: $($inventory.devices.Count). No phone binding asserted."
      - name: Measure bounded synthetic case services
        if: matrix.profile == 'production' && env.MR_SKIP_SETUP != 'true'
        shell: pwsh
        run: |
          cmake --build build --config Release --target mr_case_workload_benchmark --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_QPA_PLATFORM = 'offscreen'
          & build/Release/mr_case_workload_benchmark.exe > build/case-workload-benchmark.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage Qt runtime for installer
        id: staged_runtime
        if: ${{ env.MR_SKIP_SETUP != 'true' && !cancelled() && matrix.profile == 'production' && steps.native_build.outcome == 'success' && steps.tests.outcome == 'success' && steps.usb_inventory.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/evidence | Out-Null
          Start-Transcript -Path dist/evidence/package-transcript.txt -Force
          try { ./packaging/package-windows.ps1 }
          catch { $_ | Format-List * -Force | Out-String | Set-Content dist/evidence/package-error.txt; throw }
          finally { Stop-Transcript }
      - name: Verify staged installer runtime in isolated path with spaces
        id: staged_smoke
        if: ${{ !cancelled() && matrix.profile == 'production' && steps.staged_runtime.outcome == 'success' }}
        shell: pwsh
        run: ./packaging/smoke-windows.ps1 -Label staging
      - name: Build per-user Windows installer
        id: installer
        if: ${{ !cancelled() && matrix.profile == 'production' && steps.staged_smoke.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($compiler) { $compiler.Source } else { "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found on Windows runner' }
          & $iscc packaging/NEXVARY-MR.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify installer installation and deployed runtime
        id: installed_smoke
        if: ${{ !cancelled() && matrix.profile == 'production' && steps.installer.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-InstallerProcess([string]$FilePath, [string]$Arguments) {
            $owned = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru
            $null = $owned.Handle
            if (-not $owned.WaitForExit(120000)) {
              & taskkill.exe /PID $owned.Id /T /F | Out-Null
              throw 'Installer process exceeded its two-minute deadline'
            }
            $owned.WaitForExit()
            return $owned
          }
          $destination = Join-Path $env:RUNNER_TEMP 'NEXVARY MR install test'
          $setup = (Resolve-Path 'dist/NEXVARY-MR-Government-Setup.exe').Path
          # Managed installs must explicitly accept every declaration.
          $acceptanceFlags = @('NEXVARY_ACCEPT_LICENSE','NEXVARY_AUTHORIZED_ORG','NEXVARY_LAWFUL_USE')
          $rejected = @()
          foreach ($missing in @('all') + $acceptanceFlags) {
            $deniedDestination = Join-Path $env:RUNNER_TEMP "NEXVARY denied $missing"
            $deniedLog = Join-Path $env:RUNNER_TEMP "NEXVARY denied $missing.log"
            $accepted = if ($missing -eq 'all') { @() } else { @($acceptanceFlags | Where-Object { $_ -ne $missing } | ForEach-Object { "/$_=1" }) }
            $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LANG=en /LOG=`"$deniedLog`" /DIR=`"$deniedDestination`" " + ($accepted -join ' ')
            $denied = Invoke-InstallerProcess -FilePath $setup -Arguments $arguments
            if ($denied.ExitCode -eq 0 -or (Test-Path (Join-Path $deniedDestination 'NEXVARY-MR.exe'))) { throw "Missing $missing declaration did not block installation" }
            if (-not ((Get-Content -LiteralPath $deniedLog -Raw) -match 'Managed installation requires explicit license and authority acceptance')) { throw "Unexpected rejection cause for $missing" }
            $rejected += [ordered]@{missing=$missing;exitCode=$denied.ExitCode;blocked=$true}
          }
          $rejected | ConvertTo-Json | Set-Content dist/evidence/installer-declaration-rejections.json
          $result = Invoke-InstallerProcess -FilePath $setup -Arguments "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LANG=en /NEXVARY_ACCEPT_LICENSE=1 /NEXVARY_AUTHORIZED_ORG=1 /NEXVARY_LAWFUL_USE=1 /TASKS=desktopicon /DIR=`"$destination`""
          if ($result.ExitCode -ne 0) { throw "Installer exited $($result.ExitCode)" }
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{47622673-61BA-45EA-92F5-F30F02FF2C07}_is1'
          if (-not (Test-Path -LiteralPath $uninstallKey)) { throw 'Per-user uninstall registration was not created' }
          # Execute the installed binary itself; keep only synthetic data outside
          # its installation directory and exclude developer/Qt SDK paths.
          ./packaging/smoke-windows.ps1 -BundleDirectory $destination -Label installed -RunInPlace
          # Compare shell-extracted icons against the reviewed 32px ICO frame.
          Add-Type -AssemblyName System.Drawing
          $reference = [System.Drawing.Icon]::new((Resolve-Path 'packaging/app.ico').Path, [System.Drawing.Size]::new(32,32))
          $expectedIcon = $reference.ToBitmap()
          $iconChecks = @()
          foreach ($binary in @($setup,(Join-Path $destination 'NEXVARY-MR.exe'))) {
            $actualIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($binary)
            if (-not $actualIcon) { throw 'Missing shell executable icon' }
            $actualPixels = $actualIcon.ToBitmap()
            if ($actualPixels.Width -ne 32 -or $actualPixels.Height -ne 32) { throw 'Unexpected shell icon size' }
            for ($y=0; $y -lt 32; $y++) {
              for ($x=0; $x -lt 32; $x++) {
                if ($actualPixels.GetPixel($x,$y).ToArgb() -ne $expectedIcon.GetPixel($x,$y).ToArgb()) { throw 'Executable shell icon differs from master ICO' }
              }
            }
            $iconChecks += [ordered]@{file=[IO.Path]::GetFileName($binary);matchesMaster=$true}
            $actualPixels.Dispose(); $actualIcon.Dispose()
          }
          $expectedIcon.Dispose(); $reference.Dispose()
          $shell = New-Object -ComObject WScript.Shell
          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'NEXVARY MR/NEXVARY MR.lnk'),
            (Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'NEXVARY MR.lnk')
          )
          foreach ($linkPath in $shortcuts) {
            if (-not (Test-Path -LiteralPath $linkPath)) { throw 'Installer shortcut missing' }
            $link = $shell.CreateShortcut($linkPath)
            if ($link.TargetPath -ine (Join-Path $destination 'NEXVARY-MR.exe')) { throw 'Shortcut target mismatch' }
            if ($link.IconLocation -ine ((Join-Path $destination 'NEXVARY-MR.exe')+',0')) { throw 'Shortcut icon mismatch' }
          }
          $displayIcon = (Get-ItemProperty -LiteralPath $uninstallKey).DisplayIcon
          if ($displayIcon.Replace('"','').Split(',')[0] -ine (Join-Path $destination 'NEXVARY-MR.exe')) { throw 'Uninstall display icon mismatch' }
          [ordered]@{schemaVersion=1;icons=$iconChecks;startMenuShortcut=$true;desktopShortcut=$true;uninstallIcon=$true} | ConvertTo-Json -Depth 5 | Set-Content dist/evidence/application-icon-acceptance.json
          $uninstall = Invoke-InstallerProcess -FilePath (Join-Path $destination 'unins000.exe') -Arguments '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited $($uninstall.ExitCode)" }
          $installedExe = Join-Path $destination 'NEXVARY-MR.exe'
          for ($attempt=0; $attempt -lt 25 -and (Test-Path -LiteralPath $installedExe); $attempt++) { Start-Sleep -Milliseconds 200 }
          if (Test-Path -LiteralPath $installedExe) { throw 'Uninstaller left the installed application executable' }
          if (Test-Path -LiteralPath $uninstallKey) { throw 'Uninstaller left its per-user registry entry' }
          [ordered]@{
            schemaVersion=1; installationDirectory=$destination; installExit=$result.ExitCode
            launchMode='installed-in-place'; uninstallExit=$uninstall.ExitCode
            installedExecutableRemoved=$true; perUserUninstallRegistrationRemoved=$true
          } | ConvertTo-Json | Set-Content dist/evidence/installer-lifecycle.json
          # Repeat installation, deployed launch and removal in Arabic.
          $arabicDestination = Join-Path $env:RUNNER_TEMP 'NEXVARY MR Arabic install test'
          $arabic = Invoke-InstallerProcess -FilePath $setup -Arguments "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LANG=ar /NEXVARY_ACCEPT_LICENSE=1 /NEXVARY_AUTHORIZED_ORG=1 /NEXVARY_LAWFUL_USE=1 /DIR=`"$arabicDestination`""
          if ($arabic.ExitCode -ne 0) { throw "Arabic installation failed: $($arabic.ExitCode)" }
          if ((Get-ItemProperty -LiteralPath $uninstallKey).'Inno Setup: Language' -ne 'ar') { throw 'Arabic installer language was not selected' }
          foreach ($language in @('ar','en')) {
            foreach ($document in @("institutional-license-$language.txt","program-description-$language.txt")) {
              $installedDocument = Join-Path $arabicDestination "legal/$document"
              if (-not (Test-Path -LiteralPath $installedDocument)) { throw "Missing installed legal document: $document" }
              if ((Get-FileHash $installedDocument).Hash -ne (Get-FileHash (Join-Path packaging $document)).Hash) { throw "Installed legal document changed: $document" }
            }
          }
          ./packaging/smoke-windows.ps1 -BundleDirectory $arabicDestination -Label installed-ar -RunInPlace
          $arabicUninstall = Invoke-InstallerProcess -FilePath (Join-Path $arabicDestination 'unins000.exe') -Arguments '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          if ($arabicUninstall.ExitCode -ne 0) { throw 'Arabic uninstallation failed' }
          for ($attempt=0; $attempt -lt 25 -and (Test-Path (Join-Path $arabicDestination 'NEXVARY-MR.exe')); $attempt++) { Start-Sleep -Milliseconds 200 }
          if ((Test-Path (Join-Path $arabicDestination 'NEXVARY-MR.exe')) -or (Test-Path -LiteralPath $uninstallKey)) { throw 'Arabic uninstall left executable or registration' }
          [ordered]@{language='ar';installExit=$arabic.ExitCode;launchMode='installed-in-place';uninstallExit=$arabicUninstall.ExitCode;legalDocumentsVerified=$true} | ConvertTo-Json | Set-Content dist/evidence/installer-ar-lifecycle.json
      - name: Record artifact checksums
        if: matrix.profile == 'production' && env.MR_SKIP_SETUP != 'true'
        shell: pwsh
        run: |
          $setup = Get-Item -LiteralPath 'dist/NEXVARY-MR-Government-Setup.exe'
          "$( (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower() )  $($setup.Name)" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: matrix.profile == 'production' && env.MR_SKIP_SETUP != 'true'
        with:
          name: NEXVARY-MR-Windows-x64-installer-unsigned
          path: |
            dist/NEXVARY-MR-Government-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXVARY-MR-Windows-${{ matrix.profile }}-validation-evidence
          path: |
            build/qt-results.xml
            build/gui-repeat-results.xml
            build/gui-repeat-console.txt
            build/full-suite-last-test.log
            build/*-results.txt
            build/policy-audit-interop-results.json
            build/adb-backup-interop-results.json
            build/**/smoke-professional-ui-icon-acceptance-*.png
            build/Testing/Temporary/LastTest.log
            dist/evidence/
            build/case-workload-benchmark.json
          if-no-files-found: warn


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXVARY-MR-UI-Review
          path: |
            build/**/smoke-professional-ui-review-*.png
            build/**/ui-review-manifest.json
          if-no-files-found: warn
