name: Authorized Claude documentation development
on:
  push:
    branches: ['integration/claude-bedrock-cloud-20261119']
    paths: ['.github/claude-tasks/request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexvary-claude-development
  cancel-in-progress: false
jobs:
  authorized-development:
    if: github.repository == 'nexvary/NEXVARY-MR' && github.actor == 'nexvary' && github.ref == 'refs/heads/integration/claude-bedrock-cloud-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate explicit task and reserve isolated work branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request, urllib.error
          from pathlib import Path
          task = json.loads(Path('.github/claude-tasks/request.json').read_text())
          assert task['executor'] == 'claude' and task['enabled'] is True
          assert task['scope'] == 'documentation-validation'
          assert re.fullmatch(r'[a-z0-9-]{1,40}', task['id'])
          assert isinstance(task['instructions'], str) and 1 <= len(task['instructions']) <= 1200
          branch = 'claude/cloud-doc-' + task['id']
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/' + branch
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN']})):
                  raise RuntimeError('Task branch already exists; inspect prior result instead of repeating inference')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise RuntimeError('Cannot verify task uniqueness: HTTP ' + str(exc.code))
          assert not subprocess.check_output(['git','status','--porcelain']).strip()
          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          subprocess.run(['git','switch','-c',branch],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('DOC_TASK_ID=' + task['id'] + '\nDOC_BRANCH=' + branch + '\nDOC_BASE_SHA=' + sha + '\n')
          Path(os.environ['RUNNER_TEMP'] + '/task-prompt.txt').write_text(
              'You are executing one owner-authorized documentation task on a disposable GitHub runner. '
              'Use project_context first, then write_document, then publish_document exactly once. '
              'Do not claim publication if the tool fails. No application development, merges, shell or other services. '
              'Create a short Markdown document explaining that Claude Code runs on GitHub-hosted infrastructure using Amazon Bedrock, '
              'the owner computer may be off, and this does not verify application builds or physical devices. '
              'Include the repository and task ID. Owner instructions: ' + task['instructions'])
          PY
      - name: Prepare isolated Claude runtime and controlled MCP tools
        run: |
          cp .github/scripts/claude_doc_tools.py "$RUNNER_TEMP/claude_doc_tools.py"
          python3 -m py_compile "$RUNNER_TEMP/claude_doc_tools.py"
          npm install --prefix "$RUNNER_TEMP/claude-cli" @anthropic-ai/claude-code@2.1.328 --no-audit --no-fund
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'] + '/doc-mcp.json').write_text(json.dumps({'mcpServers':{'cloud_docs':{
              'command':'python3','args':[os.environ['RUNNER_TEMP'] + '/claude_doc_tools.py']}}}))
          PY
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.NEXVARY_BEDROCK_ROLE_ARN }}
          aws-region: eu-central-1
          role-duration-seconds: 900
          retry-max-attempts: 2
      - name: Authorized Development - Claude creates document, commit and Draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOC_WORKSPACE: ${{ github.workspace }}
          CLAUDE_CODE_USE_BEDROCK: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
        run: |
          "$RUNNER_TEMP/claude-cli/node_modules/.bin/claude" -p "$(cat "$RUNNER_TEMP/task-prompt.txt")" --model eu.anthropic.claude-sonnet-4-6 --max-turns 8 --tools "" --restricted --setting-sources "" --strict-mcp-config --mcp-config "$RUNNER_TEMP/doc-mcp.json" --allowedTools 'mcp__cloud_docs__*' --no-session-persistence --system-prompt 'Complete the assigned documentation task using only the three controlled tools. Stop after publication or a reported error. Never retry a failed publication.' --output-format json > "$RUNNER_TEMP/development-result.json"
      - name: Verify actual publication and record usage
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          output = root / 'development-result.json'
          if output.exists() and output.stat().st_size:
              result = json.loads(output.read_text())
              summary = {k:result.get(k) for k in ['is_error','num_turns','usage','total_cost_usd','modelUsage']}
              print(json.dumps(summary))
          publication = root / 'publish-result.json'
          assert publication.exists(), 'Claude did not publish a document; inspect task/tool failure'
          data = json.loads(publication.read_text())
          print(json.dumps(data))
          assert data.get('draft') is True and data.get('pr_url'), 'Commit may be preserved, but Draft PR was not created'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Claude-created Draft PR: ' + data['pr_url'] + '\n\nCommit: ' + data['commit'] + '\n')
          PY
