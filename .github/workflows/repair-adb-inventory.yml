name: Repair ADB inventory parser
on:
  push:
    branches: [feature/government-operations]
    paths:
      - 'cpp/include/AdbDeviceInventory.hpp'
      - 'cpp/tests/adb_inventory_tests.cpp'
      - '.github/workflows/repair-adb-inventory.yml'
  pull_request:
    paths:
      - 'cpp/include/AdbDeviceInventory.hpp'
      - 'cpp/tests/adb_inventory_tests.cpp'
      - '.github/workflows/repair-adb-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile parser test (Linux)
        if: runner.os == 'Linux'
        run: c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Icpp/include cpp/tests/adb_inventory_tests.cpp -o adb_inventory_tests
      - name: Run parser test (Linux)
        if: runner.os == 'Linux'
        run: ./adb_inventory_tests
      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile parser test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /Icpp\include cpp\tests\adb_inventory_tests.cpp /Fe:adb_inventory_tests.exe
      - name: Run parser test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\adb_inventory_tests.exe
