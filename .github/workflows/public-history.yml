name: Public history safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch public pull-request heads and merge snapshots
        run: git fetch https://github.com/nexvary/NEXVARY-MR.git '+refs/pull/*/head:refs/audit/pull/*/head' '+refs/pull/*/merge:refs/audit/pull/*/merge'
      - name: Test operational-data history guard
        run: python3 -m unittest discover -s tests -p test_public_history.py -v
      - name: Inspect every reachable Git blob
        run: python3 scripts/audit_public_history.py --report operational-history.json
      - name: Verify official pinned Gitleaks runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan history and current tree without exposing matches
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --log-opts='--all --full-history' --ignore-gitleaks-allow --redact=100 --no-banner --report-format json --report-path "$RUNNER_TEMP/history-redacted.json" .
          "$RUNNER_TEMP/gitleaks" dir --ignore-gitleaks-allow --redact=100 --no-banner --report-format json --report-path "$RUNNER_TEMP/tree-redacted.json" .
      - uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-MR-public-history-evidence
          path: operational-history.json
          if-no-files-found: error
