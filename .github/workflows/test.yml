name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Legacy Python regression
        run: python -m unittest discover -s tests -v
      - name: Research source and evidence classification gates
        run: |
          python scripts/validate_research_catalog.py
          python research/program/tools/validate_research.py
          cd research/program
          python -m unittest discover -s tests -v
      - name: Synthetic recovery evidence regression
        run: python -m unittest discover -s research/android-recovery -p 'test_*.py' -v
      - run: python -m pip install -r requirements.txt
      - run: python -c "import nexvary_mr.app"
